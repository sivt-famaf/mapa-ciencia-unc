[project]
name = "mapa-ciencia-unc"
version = "0.1.0"
description = "Project for UNC scientific production mapping"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.3.0",
    "jupyter>=1.0.0",
    "seaborn>=0.12.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
