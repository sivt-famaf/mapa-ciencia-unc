[project]
name = "mapa-ciencia-unc"
version = "0.1.0"
description = "Project for UNC scientific production mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3.0",
    "jupyter>=1.0.0",
    "seaborn>=0.12.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "beanie>=2.0.1",
    "motor>=3.7.1",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.6",
    "python-multipart>=0.0.20",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = [
    "ipdb>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
