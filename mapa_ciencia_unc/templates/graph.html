<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red de Investigadores</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cstyle%3Ecircle%7Bfill:%23fff%7Dline%7Bstroke:%23fff;stroke-width:2%7D%3C/style%3E%3Cline x1='20' y1='30' x2='50' y2='50'/%3E%3Cline x1='50' y1='50' x2='80' y2='30'/%3E%3Cline x1='50' y1='50' x2='70' y2='75'/%3E%3Cline x1='50' y1='50' x2='30' y2='75'/%3E%3Ccircle cx='20' cy='30' r='8'/%3E%3Ccircle cx='50' cy='50' r='8'/%3E%3Ccircle cx='80' cy='30' r='8'/%3E%3Ccircle cx='70' cy='75' r='8'/%3E%3Ccircle cx='30' cy='75' r='8'/%3E%3C/svg%3E" />

    <!-- Sigma & Graphology -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #111927, #1f2937, #111927);
        color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }
      main {
        width: min(1100px, 100%);
        background: rgba(17, 25, 40, 0.85);
        border-radius: 24px;
        padding: 2.5rem;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(16px);
      }
      h1 {
        margin-top: 0;
        font-size: 2.5rem;
        letter-spacing: 0.05em;
      }
      p {
        margin-bottom: 2rem;
        font-size: 1.1rem;
        color: #d1d5db;
      }
      .controls {
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .controls label {
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9ca3af;
      }
      .controls select {
        width: 25%;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(15, 23, 42, 0.6);
        color: #f9fafb;
        font-size: 1rem;
        appearance: none;
        outline: none;
        transition: border-color 0.2s ease;
      }
      .controls select:focus {
        border-color: #3b82f6;
      }
      .controls small {
        color: #6b7280;
        font-size: 0.85rem;
      }
      #graph-wrapper {
        display: flex;
        justify-content: center;
      }
      #container {
        width: min(900px, 100%);
        height: 600px;
        background: #e9f2ff;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .filters {
        margin-top: 0.75rem;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .filters-title {
        margin: 0.5rem 0 0.25rem;
        font-size: 0.95rem;
        color: #e5e7eb;
      }
      .filter-dropdown {
        position: relative;
        min-width: 200px;
        background: rgba(17, 24, 39, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 0.5rem;
        overflow: visible;
      }
      .filter-toggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.65rem 0.8rem;
        border: none;
        background: transparent;
        color: #f9fafb;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .filter-toggle::after {
        content: "▾";
        font-size: 0.9rem;
        color: #9ca3af;
      }
      .filter-options {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        z-index: 20;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 0.35rem 0.4rem;
        max-height: 220px;
        overflow-y: auto;
        box-shadow: 0 18px 35px rgba(0, 0, 0, 0.4);
      }
      .filter-dropdown.open .filter-options {
        display: block;
      }
      .filter-option {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.45rem;
        border-radius: 8px;
        color: #e5e7eb;
      }
      .filter-option:hover {
        background: rgba(59, 130, 246, 0.08);
      }
      .filter-option input {
        accent-color: #3b82f6;
      }
      .filters-empty {
        color: #9ca3af;
        font-size: 0.9rem;
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
      }

      .modal-content {
        background: white;
        margin: 15% auto;
        padding: 20px;
        width: 300px;
        border-radius: 8px;
        font-family: sans-serif;
      }

      .close {
        float: right;
        font-size: 20px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Researcher Network</h1>
      <p>
        Explore the relationships between researchers, collaborators, and
        thematic clusters. Click any node to jump into its detailed profile.
      </p>
      <p>
        graph: {{ graph.title }}
      </p>
      <div class="controls">
        <label for="graph-tag-select">Graph dataset (optional)</label>
        <select id="graph-tag-select"></select>
        <small id="graph-tag-status">Loading available graphs…</small>
        <p class="filters-title">Filters</p>
        <div id="filter-controls" class="filters">
          <span class="filters-empty">No filters available</span>
        </div>
      </div>
      <div id="graph-wrapper">
        <div id="container"></div>
      </div>
    </main>
    <div id="nodeModal" class="modal">
      <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <p id="modalText"></p>
      </div>
    </div>
    <script id="graph-data" type="application/json">
      {{ graph | tojson }}
    </script>
    <script>
      const getStoredToken = () => {
        const localToken = localStorage.getItem("jwtToken");
        if (localToken) return localToken;

        const cookieMatch = document.cookie.match(/(?:^|; )token=([^;]+)/);
        return cookieMatch ? decodeURIComponent(cookieMatch[1]) : null;
      };

      const requireToken = () => {
        const token = getStoredToken();
        if (!token) {
          window.location.href = "/login";
          throw new Error("Authentication required");
        }
        return token;
      };

      const getInitialGraphId = () => {
        const graphDataEl = document.getElementById("graph-data");
        if (!graphDataEl) return null;
        try {
          const parsed = JSON.parse(graphDataEl.textContent || "{}");
          return parsed?._id ?? parsed?.id ?? null;
        } catch (error) {
          console.warn("Unable to parse initial graph data", error);
          return null;
        }
      };

      (function initGraphTagSelector() {
        const selectEl = document.getElementById("graph-tag-select");
        const statusEl = document.getElementById("graph-tag-status");
        if (!selectEl || !statusEl) return;

        const { search, pathname } = window.location;
        const params = new URLSearchParams(search);
        const currentGraphId = params.get("graph_id");
        const initialGraphId = getInitialGraphId();

        const setStatus = (message, isError = false) => {
          statusEl.textContent = message;
          statusEl.style.color = isError ? "#f87171" : "#6b7280";
        };

        const applySelectionState = () => {
          const desiredId = currentGraphId || initialGraphId;
          if (desiredId) {
            const existingOption = [...selectEl.options].find(
              (option) => option.value === desiredId
            );
            if (existingOption) {
              selectEl.value = desiredId;
              return;
            }
          }
          selectEl.selectedIndex = -1;
        };

        const renderOptions = (graphs) => {
          selectEl.innerHTML = "";

          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = "Select a graph";
          placeholder.disabled = true;
          placeholder.selected = !currentGraphId;
          placeholder.hidden = true;
          selectEl.appendChild(placeholder);

          graphs.forEach((graph) => {
            const option = document.createElement("option");
            option.value = graph?._id ?? "";
            option.textContent = graph?.title ?? graph?._id ?? "Untitled graph";
            selectEl.appendChild(option);
          });

          applySelectionState();
        };

        const redirectToGraph = (graphId) => {
          const baseUrl = pathname;
          if (!graphId) {
            window.location.href = baseUrl;
            return;
          }

          const nextParams = new URLSearchParams();
          nextParams.set("graph_id", graphId);
          window.location.href = `${baseUrl}?${nextParams.toString()}`;
        };

        selectEl.addEventListener("change", (event) => {
          redirectToGraph(event.target.value);
        });

        const fetchAvailableGraphs = async () => {
          const token = requireToken();
          try {
            const response = await fetch("/api/graphs", {
              headers: {
                Authorization: `Bearer ${token}`,
              },
            });
            if (response.status === 401) {
              window.location.href = "/login";
              return;
            }
            if (!response.ok) {
              throw new Error(`Unexpected status ${response.status}`);
            }

            const payload = await response.json();
            const graphs = Array.isArray(payload) ? payload : [];

            if (!Array.isArray(graphs) || graphs.length === 0) {
              throw new Error("No available graphs returned.");
            }

            renderOptions(graphs);
            setStatus("Select a graph to load it.");
          } catch (error) {
            console.error("Failed to load graphs", error);
            renderOptions([]);
            setStatus(
              "Unable to load available graphs. Please try again.",
              true
            );
          }
        };

        fetchAvailableGraphs();
      })();
    </script>
    <script type="module" src="/static/js/graph.js"></script>
  </body>
</html>
