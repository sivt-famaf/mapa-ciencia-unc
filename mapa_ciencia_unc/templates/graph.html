<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red de Investigadores</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cstyle%3Ecircle%7Bfill:%23fff%7Dline%7Bstroke:%23fff;stroke-width:2%7D%3C/style%3E%3Cline x1='20' y1='30' x2='50' y2='50'/%3E%3Cline x1='50' y1='50' x2='80' y2='30'/%3E%3Cline x1='50' y1='50' x2='70' y2='75'/%3E%3Cline x1='50' y1='50' x2='30' y2='75'/%3E%3Ccircle cx='20' cy='30' r='8'/%3E%3Ccircle cx='50' cy='50' r='8'/%3E%3Ccircle cx='80' cy='30' r='8'/%3E%3Ccircle cx='70' cy='75' r='8'/%3E%3Ccircle cx='30' cy='75' r='8'/%3E%3C/svg%3E" />

    <!-- Sigma & Graphology -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #111927, #1f2937, #111927);
        color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }
      main {
        width: min(1100px, 100%);
        background: rgba(17, 25, 40, 0.85);
        border-radius: 24px;
        padding: 2.5rem;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(16px);
      }
      h1 {
        margin-top: 0;
        font-size: 2.5rem;
        letter-spacing: 0.05em;
      }
      p {
        margin-bottom: 2rem;
        font-size: 1.1rem;
        color: #d1d5db;
      }
      .controls {
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .controls label {
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9ca3af;
      }
      .controls select {
        width: 25%;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(15, 23, 42, 0.6);
        color: #f9fafb;
        font-size: 1rem;
        appearance: none;
        outline: none;
        transition: border-color 0.2s ease;
      }
      .controls select:focus {
        border-color: #3b82f6;
      }
      .controls small {
        color: #6b7280;
        font-size: 0.85rem;
      }
      #graph-wrapper {
        display: flex;
        justify-content: center;
      }
      #container {
        width: min(900px, 100%);
        height: 600px;
        background: #fff;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
      }

      .modal-content {
        background: white;
        margin: 15% auto;
        padding: 20px;
        width: 300px;
        border-radius: 8px;
        font-family: sans-serif;
      }

      .close {
        float: right;
        font-size: 20px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Researcher Network</h1>
      <p>
        Explore the relationships between researchers, collaborators, and
        thematic clusters. Click any node to jump into its detailed profile.
      </p>
      <p>
        graph: {{ graph.title }}
      </p>
      <div class="controls">
        <label for="graph-tag-select">Graph dataset (optional)</label>
        <select id="graph-tag-select"></select>
        <small id="graph-tag-status">Loading available graphs…</small>
      </div>
      <div id="graph-wrapper">
        <div id="container"></div>
      </div>
    </main>
    <div id="nodeModal" class="modal">
      <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <p id="modalText"></p>
      </div>
    </div>
    <script id="graph-data" type="application/json">
      {{ graph | tojson }}
    </script>
    <script>
      const getStoredToken = () => {
        const localToken = localStorage.getItem("jwtToken");
        if (localToken) return localToken;

        const cookieMatch = document.cookie.match(/(?:^|; )token=([^;]+)/);
        return cookieMatch ? decodeURIComponent(cookieMatch[1]) : null;
      };

      const requireToken = () => {
        const token = getStoredToken();
        if (!token) {
          window.location.href = "/login";
          throw new Error("Authentication required");
        }
        return token;
      };

      (function initGraphTagSelector() {
        const selectEl = document.getElementById("graph-tag-select");
        const statusEl = document.getElementById("graph-tag-status");
        if (!selectEl || !statusEl) return;

        const { search, pathname } = window.location;
        const params = new URLSearchParams(search);
        const currentGraphKey = params.get("graph_key");

        const setStatus = (message, isError = false) => {
          statusEl.textContent = message;
          statusEl.style.color = isError ? "#f87171" : "#6b7280";
        };

        const applySelectionState = () => {
          if (currentGraphKey) {
            const existingOption = [...selectEl.options].find(
              (option) => option.value === currentGraphKey
            );
            if (existingOption) {
              selectEl.value = currentGraphKey;
              return;
            }
          }
          selectEl.selectedIndex = -1;
        };

        const renderOptions = (tags) => {
          selectEl.innerHTML = "";

          const defaultOption = document.createElement("option");
          defaultOption.value = "system4_prompt2_temp07";
          defaultOption.textContent = "Default graph";
          selectEl.appendChild(defaultOption);

          tags.forEach((tag) => {
            const option = document.createElement("option");
            option.value = tag;
            option.textContent = tag;
            selectEl.appendChild(option);
          });

          applySelectionState();
        };

        const redirectToGraph = (graphKey) => {
          const baseUrl = pathname;
          if (!graphKey) {
            window.location.href = baseUrl;
            return;
          }

          const nextParams = new URLSearchParams();
          nextParams.set("graph_key", graphKey);
          window.location.href = `${baseUrl}?${nextParams.toString()}`;
        };

        selectEl.addEventListener("change", (event) => {
          redirectToGraph(event.target.value);
        });

        const fetchAvailableTags = async () => {
          const token = requireToken();
          try {
            const response = await fetch("/api/available_graph_tags", {
              headers: {
                Authorization: `Bearer ${token}`,
              },
            });
            if (response.status === 401) {
              window.location.href = "/login";
              return;
            }
            if (!response.ok) {
              throw new Error(`Unexpected status ${response.status}`);
            }

            const payload = await response.json();
            const tags =
              payload?.available_graph_tags ??
              payload?.graphs ??
              payload?.tags ??
              [];

            if (!Array.isArray(tags) || tags.length === 0) {
              throw new Error("No available graph tags returned.");
            }

            renderOptions(tags);
            setStatus("Select a tag to change the graph.");
          } catch (error) {
            console.error("Failed to load graph tags", error);
            renderOptions([]);
            setStatus(
              "Unable to load available graphs. Showing default dataset.",
              true
            );
          }
        };

        fetchAvailableTags();
      })();
    </script>
    <script type="module" src="/static/js/graph.js"></script>
  </body>
</html>
