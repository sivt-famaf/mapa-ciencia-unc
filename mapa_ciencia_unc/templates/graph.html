<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Researcher Network</title>

    <!-- Sigma & Graphology -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #111927, #1f2937, #111927);
        color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }
      main {
        width: min(1100px, 100%);
        background: rgba(17, 25, 40, 0.85);
        border-radius: 24px;
        padding: 2.5rem;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(16px);
      }
      h1 {
        margin-top: 0;
        font-size: 2.5rem;
        letter-spacing: 0.05em;
      }
      p {
        margin-bottom: 2rem;
        font-size: 1.1rem;
        color: #d1d5db;
      }
      #graph-wrapper {
        display: flex;
        justify-content: center;
      }
      #container {
        width: min(900px, 100%);
        height: 600px;
        background: #fff;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
      }

      .modal-content {
        background: white;
        margin: 15% auto;
        padding: 20px;
        width: 300px;
        border-radius: 8px;
        font-family: sans-serif;
      }

      .close {
        float: right;
        font-size: 20px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Researcher Network</h1>
      <p>
        Explore the relationships between researchers, collaborators, and
        thematic clusters. Click any node to jump into its detailed profile.
      </p>
      <div id="graph-wrapper">
        <div id="container"></div>
      </div>
    </main>
    <div id="nodeModal" class="modal">
      <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <p id="modalText"></p>
      </div>
    </div>
    <script id="graph-data" type="application/json">
      {{ graph | tojson }}
    </script>
    <script
      type="module"
      src="{{ url_for('static', path='/js/graph.js') }}"
    ></script>
  </body>
</html>
