<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Mapa Ciencia UNC{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cstyle%3Ecircle%7Bfill:%23fff%7Dline%7Bstroke:%23fff;stroke-width:2%7D%3C/style%3E%3Cline x1='20' y1='30' x2='50' y2='50'/%3E%3Cline x1='50' y1='50' x2='80' y2='30'/%3E%3Cline x1='50' y1='50' x2='70' y2='75'/%3E%3Cline x1='50' y1='50' x2='30' y2='75'/%3E%3Ccircle cx='20' cy='30' r='8'/%3E%3Ccircle cx='50' cy='50' r='8'/%3E%3Ccircle cx='80' cy='30' r='8'/%3E%3Ccircle cx='70' cy='75' r='8'/%3E%3Ccircle cx='30' cy='75' r='8'/%3E%3C/svg%3E" />

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: sans-serif;
        background: #000;
        color: #fff;
      }
      .navbar {
        background: #000;
        border-bottom: 2px solid #fff;
        padding: 1rem 2rem;
      }
      .navbar-content {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .navbar-title {
        font-size: 1.5rem;
        margin: 0;
        color: #fff;
        font-weight: 600;
      }
      .navbar-logo {
        height: 60px;
        width: auto;
      }
      .content-wrapper {
        min-height: calc(100vh - 94px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }
      main {
        width: min(1200px, 100%);
        border-radius: 4px;
        padding: 2.5rem;
      }
    </style>

    {% block extra_head %}{% endblock %}
  </head>

  <body>
    <nav class="navbar">
      <div class="navbar-content">
        <h1 class="navbar-title">Mapa Ciencia UNC</h1>
        <img src="/static/images/unc3_g.png" alt="UNC Logo" class="navbar-logo">
      </div>
    </nav>
    {% block content %}{% endblock %}

    {% block extra_scripts %}{% endblock %}
  </body>
</html>
