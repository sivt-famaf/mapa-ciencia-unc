<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
      }
      h1 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 1.8rem;
      }
      p {
        margin-top: 0;
        margin-bottom: 24px;
        color: #cbd5e1;
      }
      label {
        display: block;
        font-size: 0.95rem;
        margin-bottom: 8px;
        color: #cbd5e1;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 18px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: #0b1220;
        color: #e2e8f0;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.15s ease;
      }
      input:focus {
        border-color: #60a5fa;
      }
      button {
        width: 100%;
        padding: 12px 16px;
        background: #3b82f6;
        color: #0b1220;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      button:hover {
        background: #60a5fa;
        transform: translateY(-1px);
      }
      button:disabled {
        background: #1e293b;
        color: #94a3b8;
        cursor: not-allowed;
        transform: none;
      }
      .error {
        color: #f87171;
        margin-top: 10px;
        min-height: 20px;
      }
      .helper {
        font-size: 0.9rem;
        color: #94a3b8;
        margin-top: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Acceso</h1>
      <p>Ingresá tu usuario y contraseña para continuar.</p>
      <form id="login-form">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <button id="submit-btn" type="submit">Ingresar</button>
        <div id="error" class="error"></div>
      </form>
      <div class="helper">
        Guardamos el token de sesión en tu navegador para futuras peticiones protegidas.
      </div>
    </div>

    <script>
      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("error");
      const submitBtn = document.getElementById("submit-btn");

      const clearStoredToken = () => {
        localStorage.removeItem("jwtToken");
        document.cookie = "token=; Path=/; Max-Age=0; SameSite=Lax";
      };

      clearStoredToken();

      const setError = (message) => {
        errorEl.textContent = message || "";
      };

      const setLoading = (isLoading) => {
        submitBtn.disabled = isLoading;
        submitBtn.textContent = isLoading ? "Ingresando..." : "Ingresar";
      };

      const persistToken = (token) => {
        const maxAgeSeconds = 60 * 60; // 1 hour
        localStorage.setItem("jwtToken", token);
        document.cookie = `token=${token}; Path=/; Max-Age=${maxAgeSeconds}; SameSite=Lax`;
      };

      form?.addEventListener("submit", async (event) => {
        event.preventDefault();
        setError("");
        setLoading(true);

        const formData = new FormData(form);
        const payload = new URLSearchParams();
        payload.set("username", (formData.get("username") || "").toString().trim());
        payload.set("password", (formData.get("password") || "").toString());
        payload.set("grant_type", "password");
        payload.set("scope", "");
        payload.set("client_id", "");
        payload.set("client_secret", "");

        try {
          const response = await fetch("/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: payload.toString(),
          });

          const data = await response.json();

          if (!response.ok) {
            const detail = data?.detail || "Usuario o contraseña incorrectos.";
            throw new Error(detail);
          }

          const token = data?.access_token;
          if (!token) {
            throw new Error("No se recibió el token de acceso.");
          }

          persistToken(token);
          window.location.href = "/";
        } catch (error) {
          console.error("Login failed:", error);
          setError(error?.message || "No se pudo iniciar sesión.");
        } finally {
          setLoading(false);
        }
      });
    </script>
  </body>
</html>
