<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mapa Ciencia UNC</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .menu {
        text-align: center;
      }
      h1 {
        margin-bottom: 2rem;
        letter-spacing: 0.05em;
      }
      .buttons {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .menu-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 240px;
        height: 140px;
        border-radius: 16px;
        font-size: 1.3rem;
        text-decoration: none;
        color: #0f2027;
        background: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .menu-button:hover {
        transform: translateY(-6px);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <main class="menu">
      <h1>Mapa Ciencia UNC</h1>
      <div class="buttons">
        <a class="menu-button" href="/graph">Researcher Network</a>
        <a class="menu-button" href="/other">Other</a>
      </div>
    </main>
  </body>
</html>
